<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, follow"><title>Sistema GTD en Notion</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--g:#2D6A4F;--bg:#FAFAF8;--sf:#F2F1EE;--tx:#1A1A1A;--mu:#6B6B6B;--bd:#E0DFDB;--r:#B3261E;--a:#B26A00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,sans-serif;padding:16px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0 0 8px}h1{font-size:24px}h2{font-size:19px}
p{margin:0 0 10px}.mu{color:var(--mu);font-size:13px}.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 14px Inter,sans-serif;cursor:pointer}.btn.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;margin-bottom:6px}
.c1{background:#FBE3E1;color:var(--r)}.c2{background:#FFF0D6;color:var(--a)}.c3{background:#E3EEF9;color:#1F5C99}.c4{background:#EAEAE6;color:#555}
input,textarea,select{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:8px;background:#fff;width:100%}
#vy-volver{display:none;margin:-16px -16px 14px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}#vy-volver a{color:var(--g);font-weight:600;text-decoration:none}
.cols{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.col{min-width:170px;flex:1}.col h3{font-size:13px;margin:0 0 2px}.col .mu{margin-bottom:8px}
.it{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:9px;margin-bottom:8px;font-size:13px}
.ok{color:var(--g);font-weight:600}
</style></head><body><div id="vy-volver"><a href="/docencia/egci-liderazgo/">&larr; Volver a Liderazgo y Competencias</a></div><h1>Armá tu sistema GTD en Notion</h1>
<p class="mu">Una barra lateral con seis páginas y una base de datos de tareas con dos propiedades clave: Contexto y Cuadrante.</p>
<div style="display:flex;gap:14px;flex-wrap:wrap">
<div class="card" style="width:190px;flex-shrink:0"><p class="mu">Espacio de trabajo</p><div id="side"></div></div>
<div class="card" style="flex:1;min-width:260px" id="main"></div></div>
<div style="margin-top:12px"><button class="btn" id="fin">Ya armé mi espacio</button> <span id="msg" class="ok"></span></div><script>
var P=[
['Inbox','Captura rápida. Una página o base de datos con solo un campo de título. Se procesa a diario.'],
['Proyectos activos','Base de datos de tareas con columnas Tarea, Contexto y Cuadrante.'],
['En espera','Filtro de la base: tareas con propiedad "Esperando a". Revisalas cada semana.'],
['Algún día','Ideas sin fecha. Revisión mensual.'],
['Revisión semanal','Checklist fija: vaciar Inbox, revisar cada proyecto, mirar En espera, planear la semana y reservar bloques para C-II.'],
['Referencia','Material de consulta sin acción asociada: guías, plantillas, apuntes.']];
var T=[['Cerrar propuesta al cliente','Oficina','c1','C-I'],['Conversación difícil','1:1','c2','C-II'],['Actualizar mapa de stakeholders','Escritorio','c2','C-II'],['Responder encuesta interna','Celular','c3','C-III']];
var s=document.getElementById('side'),m=document.getElementById('main');
function show(i){s.querySelectorAll('div').forEach(function(x,j){x.style.background=j===i?'#E4EFE9':'transparent'});
var h='<h2>'+P[i][0]+'</h2><p>'+P[i][1]+'</p>';
if(i===1){h+='<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="text-align:left;color:#6B6B6B"><th>Tarea</th><th>Contexto</th><th>Cuadrante</th></tr>';
T.forEach(function(t){h+='<tr style="border-top:1px solid #E0DFDB"><td style="padding:7px 4px">'+t[0]+'</td><td>'+t[1]+'</td><td><span class="tag '+t[2]+'">'+t[3]+'</span></td></tr>'});h+='</table>';}
m.innerHTML=h}
P.forEach(function(p,i){var e=document.createElement('div');e.textContent=p[0];e.style.cssText='padding:7px 8px;border-radius:6px;cursor:pointer;font-size:14px';e.onclick=function(){show(i)};s.appendChild(e)});show(1);
document.getElementById('fin').onclick=function(){vyDone();document.getElementById('msg').textContent='Registrado en este dispositivo.'};
</script><p class="mu" style="margin-top:16px"><a href="/docencia/egci-liderazgo/#clases" target="_top" style="color:#2D6A4F">Ir a las clases</a></p>
<script>
(function(){if(window.self===window.top)document.getElementById('vy-volver').style.display='block';
var K='vy-prog:herramienta-gtd-notion';window.vyDone=function(){try{localStorage.setItem(K,'1')}catch(e){}};
function h(){try{parent.postMessage({type:'calc-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}
window.addEventListener('load',h);window.addEventListener('resize',h);new MutationObserver(h).observe(document.body,{subtree:true,childList:true,attributes:true});})();

</script></body></html>
